name: Android RAM Loader
on:
  pull_request:
    paths: ['android/**', 'docs/ANDROID-USB-INTEGRATION.md', 'docs/ANDROID-RAM-LOADER-*.md', '.github/workflows/android-ram-loader.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ram-loader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - name: Build and test comp11 (MIDI read-only; RAM physical disabled)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Package APK and test results
        run: |
          mkdir -p dist/test-results
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FM1_RAM_Loader_v1.0_comp11.apk
          cp android/app/build/test-results/testDebugUnitTest/TEST-*.xml dist/test-results/
          cp android/app/build/reports/lint-results-debug.html dist/
          cd dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose FM1_RAM_Loader_v1.0_comp11.apk
          sha256sum FM1_RAM_Loader_v1.0_comp11.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FM1_RAM_Loader_v1.0_comp11
          path: dist/
          if-no-files-found: error
