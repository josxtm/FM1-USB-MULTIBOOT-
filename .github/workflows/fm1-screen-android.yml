name: FM1 SCREEN Android

on:
  push:
    branches: [feat/fm1-screen-android]
    paths: ['fm1-screen/**', '.github/workflows/fm1-screen-android.yml']
  pull_request:
    paths: ['fm1-screen/**', '.github/workflows/fm1-screen-android.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: fm1-screen

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Read versionCode
        id: version
        run: |
          build="$(sed -n 's/^fm1Build=//p' gradle.properties)"
          [[ "$build" =~ ^[1-9][0-9]*$ ]]
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
      - name: Validate profiles and theme tokens
        run: |
          python3 - <<'PY'
          import json, pathlib
          for file in pathlib.Path('assets').rglob('*.json'):
              json.loads(file.read_text())
          PY
      - name: Unit tests and lint
        run: ./gradlew --no-daemon :core:jvmTest :app:testDebugUnitTest :app:lintDebug
      - name: Build and verify APK
        if: github.event_name != 'pull_request'
        env:
          FM1_BUILD: ${{ steps.version.outputs.build }}
          PREVIOUS_BUILD: 13
          PREVIOUS_CERTIFICATE: 104c06cbdc66e123fcd2741c61e38ff426d97ef406b493af0e370220a6d8a2d5
          FM1_KEYSTORE_BASE64: ${{ secrets.FM1_KEYSTORE_BASE64 }}
          FM1_SIGNING_ALIAS: ${{ secrets.FM1_SIGNING_ALIAS }}
          FM1_SIGNING_STORE_PASSWORD: ${{ secrets.FM1_SIGNING_STORE_PASSWORD }}
          FM1_SIGNING_KEY_PASSWORD: ${{ secrets.FM1_SIGNING_KEY_PASSWORD }}
        run: |
          variant=debug
          signing='debug certificate for this runner'
          if [[ -n "$FM1_KEYSTORE_BASE64" ]]; then
            umask 077
            export FM1_SIGNING_PATH="$RUNNER_TEMP/fm1-signing.jks"
            trap 'rm -f "$FM1_SIGNING_PATH"' EXIT
            printf '%s' "$FM1_KEYSTORE_BASE64" | base64 --decode > "$FM1_SIGNING_PATH"
            variant=release
            signing='owner distribution certificate'
          fi
          ./gradlew --no-daemon ":app:assemble${variant^}"
          apk="FM1-SCREEN-v1.0-comp.$FM1_BUILD.apk"
          sdktools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p distribution
          cp "app/build/outputs/apk/$variant/app-$variant.apk" "distribution/$apk"
          git -C .. archive --format=zip --output="$PWD/distribution/corresponding-source.zip" HEAD fm1-screen .github/workflows/fm1-screen-android.yml
          "$sdktools/apksigner" verify --verbose --print-certs "distribution/$apk" > distribution/apk-signature.txt
          "$sdktools/aapt" dump badging "distribution/$apk" > distribution/apk-metadata.txt
          grep -F "name='com.josxtm.fm1screen' versionCode='$FM1_BUILD' versionName='1.0'" distribution/apk-metadata.txt
          (
            cd distribution
            sha256sum "$apk" > "$apk.sha256"
            sha256sum -c "$apk.sha256"
          )
          certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' distribution/apk-signature.txt)"
          upgrade="Different certificate from comp.$PREVIOUS_BUILD. Clean install required."
          if [[ "$certificate" == "$PREVIOUS_CERTIFICATE" ]]; then
            upgrade="Same certificate as comp.$PREVIOUS_BUILD."
          fi
          {
            printf '# FM1 SCREEN v1.0 · comp. %s\n\n' "$FM1_BUILD"
            printf -- '- Commit: %s\n- Signing: %s\n- Certificate SHA-256: %s\n- Upgrade: %s\n' \
              "$GITHUB_SHA" "$signing" "$certificate" "$upgrade"
            printf -- '- Unit tests, lint, APK signature and checksum passed.\n'
            printf '\n```\n'
            cat "distribution/$apk.sha256"
            printf '```\n'
          } | tee distribution/build-report.md
          cat distribution/build-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FM1-SCREEN-tests-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            fm1-screen/core/build/test-results/jvmTest/*.xml
            fm1-screen/app/build/test-results/testDebugUnitTest/*.xml
            fm1-screen/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: FM1-SCREEN-v1.0-comp.${{ steps.version.outputs.build }}
          path: fm1-screen/distribution/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  visual:
    if: github.event_name != 'pull_request'
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        device: [tablet, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FM1-SCREEN-v1.0-comp.${{ needs.apk.outputs.build }}
          path: fm1-screen/distribution
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >-
            python3 fm1-screen/tests/android_smoke.py
            "fm1-screen/distribution/FM1-SCREEN-v1.0-comp.${{ needs.apk.outputs.build }}.apk"
            fm1-screen/distribution/screenshots
            "${{ matrix.device }}" "${{ needs.apk.outputs.build }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FM1-SCREEN-GUI-comp.${{ needs.apk.outputs.build }}-${{ matrix.device }}
          path: fm1-screen/distribution/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
