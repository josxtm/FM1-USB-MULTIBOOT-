name: Embedded multiboot core
on:
  pull_request:
    paths:
      - 'src/embedded_multiboot.*'
      - 'tests/**'
      - 'scripts/validate_embedded_render.py'
      - 'docs/goose/**'
      - 'Makefile'
      - '.github/workflows/embedded-multiboot-core.yml'
      - 'docs/goose/FASE-5A-RESULTADOS.md'
      - 'docs/goose/EMBEDDED-MULTIBOOT-CORE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run portable C99 core tests
        run: |
          make core-test | tee core-test-results.txt
          make render-demo | tee render-demo-results.txt
          make render-matrix | tee render-matrix-results.txt
          python3 scripts/validate_embedded_render.py build/embedded-coverflow-demo.svg
          test -s build/embedded-e2e-trace.txt
          make memory-report
          make core-sanitize | tee sanitizer-results.txt
          make test | tee usb-test-results.txt
      - name: Compile core with strict host warnings
        run: cc -std=c99 -pedantic -Wall -Wextra -Werror -Isrc -c src/embedded_multiboot.c -o embedded_multiboot.o
      - name: Compile independent pi32v2 object
        run: |
          scripts/get-toolchain.sh toolchain
          make TOOLCHAIN=toolchain core-pi32v2-object core-pi32v2-sim
          toolchain/bin/llvm-readelf -h -S -s build/embedded_multiboot_pi32v2.o > pi32v2-core-elf-report.txt
          toolchain/bin/llvm-readelf -h -S -s build/embedded_multiboot_pi32v2.elf > pi32v2-core-linked-elf-report.txt
      - name: Verify physical launch paths remain absent
        run: |
          ! grep -nE 'lcd_init|husb_init|usb_enumerate|disk_read|0x25|0x30' src/embedded_multiboot.c
          grep -n 'MB_LAUNCH_BLOCKED' src/embedded_multiboot.c
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-multiboot-core-results
          path: |
            core-test-results.txt
            render-demo-results.txt
            render-matrix-results.txt
            build/embedded-coverflow-demo.svg
            build/embedded-e2e-trace.txt
            build/memory-budget.txt
            sanitizer-results.txt
            usb-test-results.txt
            build/embedded_multiboot_pi32v2.o
            build/embedded_multiboot_pi32v2.elf
            build/embedded_multiboot_pi32v2.map
            pi32v2-core-elf-report.txt
            pi32v2-core-linked-elf-report.txt
          if-no-files-found: error
