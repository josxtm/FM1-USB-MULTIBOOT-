plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.josxtm.fm1ramloader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.josxtm.fm1ramloader'
        minSdk 30
        targetSdk 35
        versionCode 15
        versionName '1.0-comp15'
    }
    flavorDimensions 'scope'
    productFlavors {
        loader { dimension 'scope' }
        manager {
            dimension 'scope'
            applicationId 'com.josxtm.fm1managerusb'
            versionCode 1
            versionName '1.0-alpha01'
        }
    }
    sourceSets {
        main.assets.setSrcDirs([])
        loader.assets.setSrcDirs(['src/main/assets'])
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.all {
            systemProperty 'fm1.reference', file('src/main/assets/fm1-usb-diagnostics-ram-experimental.bin').absolutePath
            systemProperty 'fm1.discovery', file('src/manager/assets/discovery.json').absolutePath
            systemProperty 'fm1.card.fixture', layout.buildDirectory.dir('manager-contract-card/FM1').get().asFile.absolutePath
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
